name: injex hidden-text scan
description: Fail the build on hidden prompt injection — invisible Unicode, look-alikes, hidden comments and white text in code, docs, PDFs and Word files — and on risky AI-agent configuration.
author: 0xnookie
branding:
  icon: eye-off
  color: gray-dark

inputs:
  path:
    description: Files or folders to scan, separated by spaces or new lines. Folders in a git repository use the files git tracks.
    required: false
    default: .
  fail-on:
    description: Fail when a finding is at least this severe — critical, high, medium, low or none.
    required: false
    default: high
  min-severity:
    description: Only report findings at least this severe.
    required: false
    default: low
  exclude:
    description: Glob patterns to skip, one per line (in addition to .injexignore).
    required: false
    default: ''
  sarif:
    description: Also write a SARIF report to this path, for github/codeql-action/upload-sarif.
    required: false
    default: ''
  audit:
    description: Also audit AI-agent configuration (auto-approve settings, hooks, MCP servers, folder-open tasks, AI workflows) — true or false.
    required: false
    default: 'true'
  scan-files:
    description: Scan the files in path (set to false to only scan the event).
    required: false
    default: 'true'
  scan-event:
    description: Scan the issue, pull request or comment text of the triggering event for hidden or instruction-like text — run this before an AI agent step and gate it on the event-gate output.
    required: false
    default: 'false'
  event-fail-on:
    description: Fail the event scan when a finding is at least this severe.
    required: false
    default: high

outputs:
  findings:
    description: Number of findings reported.
    value: ${{ steps.scan.outputs.findings }}
  failing:
    description: Number of findings at or above fail-on.
    value: ${{ steps.scan.outputs.failing }}
  event-findings:
    description: Number of findings in the event text (with scan-event).
    value: ${{ steps.event.outputs.event-findings }}
  event-gate:
    description: pass or fail — whether the event text is safe to hand to an AI agent (with scan-event).
    value: ${{ steps.event.outputs.event-gate }}

runs:
  using: composite
  steps:
    - id: event
      if: inputs.scan-event == 'true'
      shell: bash
      env:
        INJEX_EVENT_FAIL_ON: ${{ inputs.event-fail-on }}
      run: |
        node "$GITHUB_ACTION_PATH/cli/injex.mjs" event --format github --fail-on "$INJEX_EVENT_FAIL_ON" "$GITHUB_EVENT_PATH"

    - id: scan
      if: inputs.scan-files == 'true'
      shell: bash
      # inputs go through the environment, never into the script text
      env:
        INJEX_PATHS: ${{ inputs.path }}
        INJEX_FAIL_ON: ${{ inputs.fail-on }}
        INJEX_MIN_SEVERITY: ${{ inputs.min-severity }}
        INJEX_EXCLUDE: ${{ inputs.exclude }}
        INJEX_SARIF: ${{ inputs.sarif }}
        INJEX_AUDIT: ${{ inputs.audit }}
      run: |
        set -f
        args=(scan --format github --fail-on "$INJEX_FAIL_ON" --min-severity "$INJEX_MIN_SEVERITY")
        if [ -n "$INJEX_SARIF" ]; then args+=(--sarif "$INJEX_SARIF"); fi
        if [ "$INJEX_AUDIT" = "false" ]; then args+=(--no-audit); fi
        while IFS= read -r glob; do
          if [ -n "$glob" ]; then args+=(--exclude "$glob"); fi
        done <<< "$INJEX_EXCLUDE"
        args+=(--)
        for p in $INJEX_PATHS; do args+=("$p"); done
        node "$GITHUB_ACTION_PATH/cli/injex.mjs" "${args[@]}"
