name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test suite
        run: node test/run-tests.mjs

      - name: Syntax-check all sources (as ES modules)
        run: |
          set -e
          for f in src/*.js src/core/*.js src/core/docs/*.js src/data/*.js ui/*.js ui/views/*.js cli/*.mjs tools/*.mjs test/*.mjs bench/*.mjs contrib/promptfoo/*.mjs vscode/*.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Content script is a classic script (no import / export)
        run: |
          node -e "new (require('vm').Script)(require('fs').readFileSync('src/content/paste-guard.js', 'utf8'), { filename: 'paste-guard.js' }); console.log('paste-guard.js OK')"

      # injex scanning itself, through the action in this repository (action.yml)
      - name: No hidden text in the repository
        uses: ./
        with:
          fail-on: high

      - name: Scanner benchmark (recall on the lab corpus, false positives on benign text)
        run: node bench/run.mjs --check

      - name: Transform index is in sync with src/transforms
        run: |
          node tools/sync-transforms.mjs --check

      - name: Validate manifest.json
        run: |
          node -e "
            const m = require('./manifest.json'), p = require('./package.json');
            if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('bad version ' + m.version);
            if (m.version !== p.version) throw new Error('manifest ' + m.version + ' != package ' + p.version);
            const fs = require('fs');
            for (const f of [m.background.service_worker, m.action.default_popup, m.options_page, ...Object.values(m.icons)]) if (!fs.existsSync(f)) throw new Error('missing ' + f);
            console.log('manifest OK v' + m.version);
          "

      - name: Firefox build
        run: |
          node tools/build-firefox.mjs --zip injex-firefox.zip
          unzip -l injex-firefox.zip | tail -1
          node -e "
            const m = require('./dist/firefox/manifest.json');
            if (!m.background.scripts || m.background.service_worker) throw new Error('Firefox needs background.scripts');
            if (!m.browser_specific_settings?.gecko?.id) throw new Error('missing gecko id');
            console.log('Firefox manifest OK, min ' + m.browser_specific_settings.gecko.strict_min_version);
          "

      - name: Plus builds (OCR and ML packs fetched and checked against their pinned hashes)
        run: |
          node tools/fetch-packs.mjs
          node tools/build-plus.mjs
          node tools/build-firefox.mjs
          node -e "const m = require('./dist/plus/chrome/manifest.json'); if (!/wasm-unsafe-eval/.test(m.content_security_policy.extension_pages)) throw new Error('plus CSP'); if (require('fs').existsSync('dist/firefox/vendor/packs')) throw new Error('packs in the default build'); console.log('plus builds OK')"
          node cli/injex.mjs ml status

      - name: Docker image builds and runs (CLI and MCP server)
        run: |
          docker build -t injex-ci .
          docker run --rm injex-ci --version
          printf 'a\xe2\x80\x8bb' | docker run --rm -i injex-ci clean --check && exit 1 || echo "clean --check flags the zero-width space"
          docker run --rm -v "$PWD/test/fixtures:/work:ro" injex-ci scan --quiet --fail-on none
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i injex-ci mcp | grep -q '"serverInfo"' && echo "MCP server in the image answers"

      - name: VS Code extension packs (.vsix)
        run: |
          node tools/build-vscode.mjs
          unzip -l dist/injex-vscode-*.vsix | tail -1

      - name: MCP bundle builds and its server starts on its own
        run: |
          node tools/build-mcpb.mjs
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/dist/mcpb/server/cli/injex.mjs" mcp --root '${user_config.root}') \
            | node -e "let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () => { const r = s.trim().split('\n').map(JSON.parse); const n = r[1].result.tools.length; if (!r[0].result.serverInfo || n < 10) throw new Error('bundled server did not answer'); console.log('bundled MCP server OK, ' + n + ' tools'); })"
